    <!-- Google-Bewertungen: Karten und Durchschnitt kommen aus src/data/google-reviews.json (per scripts/update-reviews.mjs gepflegt). Eine Anzahl wird bewusst nirgends genannt. -->
    <section data-reviews-section class="hidden py-20 bg-white border-t border-gray-100">
        <div class="container mx-auto px-4 max-w-6xl">

            <div class="flex flex-col lg:flex-row justify-between items-center mb-10 gap-6">
                <div class="text-center lg:text-left">
                    <h3 class="text-3xl md:text-4xl font-bold mb-4 text-gray-900 tracking-tighter">Was unsere Kunden sagen</h3>
                    <div class="w-24 h-1 bg-[#8B4513] mx-auto lg:mx-0 rounded-full"></div>
                </div>
                <div class="flex flex-col sm:flex-row items-center gap-5 md:gap-8">
                    <div class="flex items-center gap-3">
                        <div data-count-up="50" data-count-suffix="+" class="text-4xl md:text-5xl font-extrabold text-blue-500 tracking-tighter tabular-nums">50+</div>
                        <p class="text-sm md:text-base font-bold text-gray-900 leading-tight uppercase tracking-tight text-left">Zufriedene<br>Kunden</p>
                    </div>
                    <div class="flex items-center gap-4 bg-gray-50 px-6 py-3 rounded-full border border-gray-200 shadow-sm">
                        <div class="text-2xl"><i class="fab fa-google text-blue-500"></i></div>
                        <div>
                            <span class="relative inline-block text-sm mb-0.5 leading-none">
                                <span class="text-gray-300 whitespace-nowrap"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
                                <span data-avg-fill class="absolute inset-y-0 left-0 overflow-hidden whitespace-nowrap text-yellow-400" style="width:0%"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
                            </span>
                            <p class="text-[11px] font-bold text-gray-600 uppercase tracking-wider"><span data-avg-number>–</span> / 5,0 Google-Bewertungen</p>
                        </div>
                    </div>
                </div>
            </div>

            <div data-reviews-track class="overflow-hidden [mask-image:linear-gradient(to_right,transparent,black_4%,black_96%,transparent)]"></div>
        </div>

        <template data-review-template>
            <article class="shrink-0 w-[300px] md:w-[360px] bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-3 min-w-0">
                        <div data-field="initial" class="w-10 h-10 shrink-0 bg-[#8B4513]/10 text-[#8B4513] rounded-full flex items-center justify-center font-bold text-lg"></div>
                        <div class="min-w-0">
                            <h4 data-field="name" class="font-bold text-gray-900 text-sm truncate"></h4>
                            <p data-field="time" class="text-xs text-gray-500"></p>
                        </div>
                    </div>
                    <i class="fab fa-google text-gray-300 text-xl"></i>
                </div>
                <span class="relative inline-block text-xs mb-3 leading-none self-start">
                    <span class="text-gray-300 whitespace-nowrap"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
                    <span data-field="stars" class="absolute inset-y-0 left-0 overflow-hidden whitespace-nowrap text-yellow-400"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
                </span>
                <p data-field="text" class="text-gray-600 text-sm leading-relaxed line-clamp-6"></p>
            </article>
        </template>
    </section>
