    <!-- Gemeinsamer Head-Teil der Google-Ads-Landingpages unter /lp/: bewusst noindex (die SEO-Seite

    <link rel="preload" as="image" type="image/webp" href="/lp-img/{=$img}.webp" imagesrcset="/lp-img/{=$img}-600.webp 600w, /lp-img/{=$img}.webp {=$img_w}w" imagesizes="(min-width: 1024px) 50vw, 100vw" fetchpriority="high">
