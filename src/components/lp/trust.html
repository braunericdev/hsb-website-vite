<!-- Vertrauensleiste unter dem Hero-CTA. Google-Wert (Zahl + Sternfüllung) setzt main.js aus
     src/data/google-reviews.json, bis dahin unsichtbar, damit nie ein veralteter Wert steht. -->
<ul class="mt-6 flex flex-wrap items-center gap-x-5 gap-y-3 text-sm font-bold text-gray-700">
    <li data-avg-badge class="invisible flex items-center gap-2 bg-white border border-gray-200 rounded-full px-3 py-1.5 shadow-sm">
        <i class="fab fa-google text-blue-500"></i>
        <span class="relative inline-block text-xs leading-none">
            <span class="text-gray-300 whitespace-nowrap"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
            <span data-avg-fill class="absolute inset-y-0 left-0 overflow-hidden whitespace-nowrap text-yellow-400" style="width:0%"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i></span>
        </span>
        <span><span data-avg-number>–</span> / 5,0</span>
    </li>
    <li class="flex items-center gap-2"><i class="fas fa-check text-green-600"></i> Festpreis</li>
    <li class="flex items-center gap-2"><i class="fas fa-check text-green-600"></i> Antwort innerhalb von 24&nbsp;h</li>
    <li class="flex items-center gap-2"><i class="fas fa-check text-green-600"></i> Eric &amp; Dennis persönlich</li>
</ul>
