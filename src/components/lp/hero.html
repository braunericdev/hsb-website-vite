<!-- Hero der Landingpages. Parameter: h1, accent (zweiter, braun gesetzter Teil der H1), sub,
     img (Dateiname ohne Endung in /lp-img/, jeweils als .webp und -600.webp), img_w, img_h, alt.
     data-lp-hero: main.js blendet die mobile Sticky-Leiste erst ein, wenn dieser Bereich verlassen ist. -->
<section data-lp-hero class="bg-gray-50 border-b border-gray-100">
    <div class="container mx-auto px-4 py-8 md:py-14 grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center">
        <div>
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 md:mb-6 text-gray-900 leading-tight tracking-tighter">
                {=$h1} <span class="text-[#8B4513]">{=$accent}</span>
            </h1>
            <p class="text-lg md:text-xl text-gray-600 font-medium leading-relaxed mb-6 md:mb-8">{=$sub}</p>
            <a href="#angebot" class="pulse-cta flex sm:inline-flex items-center justify-center gap-2 w-full sm:w-auto bg-[#1F6F4A] text-white px-8 py-4 rounded-xl font-bold text-base md:text-lg uppercase tracking-wide shadow-lg hover:bg-[#164F35] active:scale-95 transition">
                Kostenloses Angebot anfordern <i class="fas fa-arrow-right"></i>
            </a>
            <load src="src/components/lp/trust.html" />
        </div>
        <picture class="block">
            <source type="image/webp" srcset="/lp-img/{=$img}-600.webp 600w, /lp-img/{=$img}.webp {=$img_w}w" sizes="(min-width: 1024px) 50vw, 100vw">
            <img src="/lp-img/{=$img}.webp" width="{=$img_w}" height="{=$img_h}" alt="{=$alt}" fetchpriority="high" decoding="async" class="w-full h-auto max-h-[28rem] object-cover rounded-2xl shadow-xl">
        </picture>
    </div>
</section>
